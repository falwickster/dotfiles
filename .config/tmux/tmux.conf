# tmux config, checked out to $HOME/.config/tmux/tmux.conf by the dotfiles
# bare-repo workflow (see README.md). Visuals are inspired by Omarchy's
# tmux theme, but kept fully translucent to the host terminal (WezTerm):
# every element below uses `bg=default` rather than a solid fill, so the
# terminal's own background/transparency always shows through. Only status
# bar text, mode/prefix/zoom indicators, and pane border colors get an
# accent color - pane *content* (the shell itself) is never touched.
#
# Keybindings are intentionally left at tmux's stock defaults (prefix
# stays Ctrl-b, copy-mode stays `emacs`, no vi keys, no pane/window/session
# letter-key remaps). Every default binding already ships its own
# human-readable note, so `prefix + ?` (unchanged key, just wrapped in a
# nicer popup below) lists every keybinding with a plain-English
# description - no plugin needed for discoverability.

# --- Copy-mode: explicitly non-vi (tmux's default, stated for clarity) --
setw -g mode-keys emacs

# --- General quality-of-life (keybinding-neutral) -----------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
# .zshrc starts a brand-new session on every login shell (no reattachment
# by design). Without this, closing a terminal only *detaches* its
# session, leaving it running server-side forever - so every subsequent
# login piles another numbered session on top of ever-growing leftovers.
# This destroys a session the moment it has no attached client, so the
# session count always reflects only currently-open terminal windows.
set -g destroy-unattached on

# --- Discoverability: prefix + ? as an overlay popup (same stock key) ---
# Same trigger key tmux already binds by default (`list-keys -N`), just
# rendered as a popup overlay instead of a full-screen window, closer to
# zellij's always-just-a-keypress-away hint screen.
bind -N "Show tmux keybindings" ? display-popup -E -w 80% -h 80% -T " tmux keybindings (prefix + ?) " "tmux list-keys -N | less -R"

# --- Status bar -----------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string '#h:#W'

# --- Theme: translucent everywhere, blue accents only --------------------
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=blue,bold] #S #[fg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]?:keys  #h "
set -g window-status-format "#[fg=brightblack,bg=default] #I:#W "
set -g window-status-current-format "#[fg=blue,bg=default,bold] #I:#W "
set -g pane-border-style "fg=brightblack,bg=default"
set -g pane-active-border-style "fg=blue,bg=default"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
